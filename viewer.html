<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BINA PivotChart Viewer</title><link rel="stylesheet" href="css/BinaPivotChart.css"><style>html,body{margin:0;min-height:100%;background:#f1f4f8}</style></head>
<body><div id="chart-viewer"></div><script src="js/BinaPivotRenderer.js"></script><script src="js/BinaPivotChart.js"></script><script src="js/BinaPivotViewer.js"></script><script src="js/demo-data.js"></script>
<script>
(async function(){
 const query=new URLSearchParams(location.search), id=query.get('id')||'finance-demo';
 let config=window.BinaPivotDemoConfig;
 try{
  // Production: set the service URL, then open viewer.html?id=your-chart&server=1.
  const service='/BinaPivotChartService.asmx';
  if(query.get('server')==='1')config=await BinaPivotChart.loadFromServer(service,id);
  else {let local=null;try{local=localStorage.getItem('BinaPivotChart::'+id);}catch(e){if(id!=='finance-demo')throw e;}if(local)config=JSON.parse(local);else if(id!=='finance-demo')throw Error('نمودار با شناسه انتخاب‌شده در مرورگر وجود ندارد.');}
 }catch(err){document.getElementById('chart-viewer').textContent='خطای دریافت نمودار: '+err.message;return;}
 // IMPORTANT: For production, pass dataProvider and remove demo-data.js.
 window.binaViewer=new BinaPivotViewer('#chart-viewer',{config,data:window.BinaPivotDemoRows});
})();
</script></body></html>
